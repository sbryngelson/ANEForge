name: CI

# ANEForge dispatches to the Apple Neural Engine, which GitHub's hosted runners cannot
# reach: their macOS images are Apple Silicon but virtualized, and the ANE is not passed
# through to the guest (the same reason CoreML falls back to CPU in a VM). So the on-device
# correctness corpus (tests/run_corpus.py) is run by hand on a Mac with an ANE, e.g.
# `bash scripts/reproduce.sh gates`. This workflow covers everything CI *can* verify:
# lint, packaging, a multi-version compile + import matrix, the hardware-free unit tests,
# the documentation build, and — on a hosted macOS runner — that the Objective-C++
# dispatch dylib actually compiles (which the Linux jobs cannot do).

on:
  push:
    branches: [main]
  pull_request:
  # Weekly drift watch: this project links private Apple framework symbols, so a macOS or
  # Xcode update on the hosted images can break the dispatch-dylib build with no code change
  # on our side. Re-running CI on a schedule turns "did Apple break us" into an automated
  # signal instead of something noticed at the next commit. Mondays 07:00 UTC.
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:   # allow a manual run (e.g. to exercise the scheduled path on demand)

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint (ruff + 2-space)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # hatch-vcs derives the version from tags
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install ruff pylint
      - run: ruff check
      # Lock the tinygrad-compact 2-space style: W0311 (bad indentation) + C0303
      # (trailing whitespace), enforced with a 2-space indent string. Nothing else.
      - run: python -m pylint --disable=all -e W0311 -e C0303 --indent-string='  ' --recursive=y aneforge tests

  types:
    name: types (pyright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # hatch-vcs derives the version from tags
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      # pyright must resolve the lazily-imported OPTIONAL deps so it doesn't report
      # them as missing: scipy (dsp/special reference paths) and the model-loader
      # stack (torch/torchvision/transformers/huggingface_hub via the `models` extra).
      # This matches the local type-check environment.
      - run: pip install -e ".[dev,models]" scipy
      - run: pyright aneforge   # gate at 0 errors (pyright pinned in the dev extra)

  build:
    name: package (build + twine)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # hatch-vcs derives the version from tags
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*

  compile-import:
    name: compile + import (py ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # hatch-vcs derives the version from tags
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      # Every module byte-compiles (no import, so no dylib/ANE needed).
      - run: python -m compileall -q aneforge
      # The package imports with only NumPy and builds a graph; compile/dispatch is lazy
      # and needs the ANE, so it is exercised on-device, not here.
      - run: pip install -e .
      - run: python -c "import aneforge as af; print('aneforge', af.__version__); af.input((1, 3, 8, 8))"

  unit-tests:
    name: off-device unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # hatch-vcs derives the version from tags
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      # Every hardware-free suite. Device tests carry the `requires_ane` marker and are
      # deselected here; what remains runs off-device (rate-limiter, cost-model projections,
      # op catalog, target/family tables, build guards, graph-rewrite identities, route and
      # preflight reconciliation, ...). New unmarked suites are picked up automatically.
      - run: pytest -m "not requires_ane" -q

  docs:
    name: docs (mkdocs build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # hatch-vcs derives the version from tags
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -r docs/requirements.txt
      - run: mkdocs build --strict

  macos:
    name: macOS build + smoke (${{ matrix.os }}, no ANE)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false   # one OS image breaking must not mask the others' status
      matrix:
        # macos-14 = oldest supported (README: macOS 14+); macos-15 = current; macos-latest
        # auto-tracks the newest hosted image, so a future macOS/Xcode bump is caught by the
        # weekly run without editing this list. latest may alias 15 today; the overlap is cheap.
        os: [macos-14, macos-15, macos-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # hatch-vcs derives the version from tags
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      # The Objective-C++ dispatch shim links Apple frameworks and only builds on macOS;
      # this proves it compiles. The hosted runner has no ANE, so it is never dispatched
      # (the dylib loads lazily on first dispatch, which does not happen here).
      - run: sh aneforge/_lib/build.sh
      - run: python -m compileall -q aneforge
      - run: pip install -e ".[dev]"
      # Import + graph build on macOS, and every hardware-free suite (device tests, marked
      # `requires_ane`, are deselected; the ANE is never dispatched on this runner).
      - run: python -c "import aneforge as af; print('aneforge', af.__version__); af.input((1, 3, 8, 8))"
      - run: pytest -m "not requires_ane" -q
