name: pages

# Deploy the landing page in web/ to GitHub Pages, served at
# https://sbryngelson.github.io/ANEForge/. Runs only on pushes to main that touch
# web/ (so a merge publishes; PRs do not). docs/ is the MkDocs package-docs source
# for Read the Docs and is unrelated to this.
on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Configure Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true   # turn on Pages (GitHub Actions source) on first run
      - name: Upload web/ as the Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: web
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
